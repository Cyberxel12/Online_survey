<!-- The "Profile" tab is active based on page content -->
<script>
        // === Sex card selection ===
        function selectSex(label, value) {
            document.querySelectorAll('.sex-card').forEach(l => l.classList.remove('is-selected'));
            label.classList.add('is-selected');
            const radio = label.querySelector('input[name="sex"]');
            if (radio) radio.checked = true;
        }

        // === Strand chip selection ===
        function selectStrand(btn) {
            document.querySelectorAll('.strand-chip').forEach(c => c.classList.remove('is-selected'));
            btn.classList.add('is-selected');
            const radio = btn.querySelector('input[name="strand"]');
            if (radio) radio.checked = true;
            
            const otherContainer = document.getElementById('other-strand-container');
            if (btn.getAttribute('data-strand') === 'Other') {
                otherContainer.classList.remove('hidden');
                document.getElementById('other-strand').focus();
            } else {
                otherContainer.classList.add('hidden');
            }
        }

        // === Pre-fill from draft ===
        const draft = SurveyDB.getDraft();
        if (draft) {
            if (draft.name && draft.name !== 'Anonymous') document.getElementById('full-name').value = draft.name;
            if (draft.age) document.getElementById('age').value = draft.age;
            if (draft.sex) {
                const sexLabel = document.querySelector(`.sex-card input[value="${draft.sex}"]`);
                if (sexLabel) selectSex(sexLabel.closest('.sex-card'), draft.sex);
            }
            if (draft.strand) {
                const standardStrands = ['STEM', 'HUMSS', 'ABM', 'GAS', 'TVL', 'ArtsAndDesign', 'Sports', 'HE', 'CSS', 'SMAW'];
                if (standardStrands.includes(draft.strand)) {
                    const strandBtn = document.querySelector(`.strand-chip[data-strand="${draft.strand}"]`);
                    if (strandBtn) selectStrand(strandBtn);
                } else {
                    const otherBtn = document.querySelector(`.strand-chip[data-strand="Other"]`);
                    if (otherBtn) {
                        selectStrand(otherBtn);
                        const otherInput = document.getElementById('other-strand');
                        if (otherInput) otherInput.value = draft.strand;
                    }
                }
            }
            if (draft.section) document.getElementById('section').value = draft.section;
        }

        // === Back button ===
        document.getElementById('btn-back').addEventListener('click', () => {
            saveCurrentToDraft();
            window.location.href = 'introduction.html';
        });

        // === Save draft ===
        function saveCurrentToDraft() {
            const name = document.getElementById('full-name').value.trim();
            const age = document.getElementById('age').value;
            const sexEl = document.querySelector('input[name="sex"]:checked');
            
            const strandEl = document.querySelector('input[name="strand"]:checked');
            let strandValue = '';
            if (strandEl) {
                if (strandEl.value === 'Other') {
                    strandValue = document.getElementById('other-strand').value.trim();
                } else {
                    strandValue = strandEl.value;
                }
            }
            
            const section = document.getElementById('section').value.trim();
            SurveyDB.saveDraft({
                name,
                age: age ? parseInt(age) : '',
                sex: sexEl ? sexEl.value : '',
                strand: strandValue,
                section
            });
        }

        // === Form validation & navigation ===
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('full-name').value.trim();
            const ageVal = document.getElementById('age').value.trim();
            const age = parseInt(ageVal);
            const sexEl = document.querySelector('input[name="sex"]:checked');
            
            const strandEl = document.querySelector('input[name="strand"]:checked');
            let strandValue = '';
            if (strandEl) {
                if (strandEl.value === 'Other') {
                    strandValue = document.getElementById('other-strand').value.trim();
                } else {
                    strandValue = strandEl.value;
                }
            }
            
            const section = document.getElementById('section').value.trim();

            if (name && SurveyDB.hasSubmitted(name)) {
                alert('This Full Name has already completed the survey. You cannot answer the survey again.');
                return;
            }
            if (!ageVal || isNaN(age) || age <= 0) { alert('Please enter a valid Age.'); return; }
            if (!sexEl) { alert('Please select your Sex.'); return; }
            if (!strandEl) { alert('Please select your Strand.'); return; }
            if (strandEl.value === 'Other' && !strandValue) { alert('Please specify your Strand.'); return; }
            if (!section) { alert('Please enter your Section.'); return; }

            SurveyDB.saveDraft({ name: name || 'Anonymous', age, sex: sexEl.value, strand: strandValue, section });
            window.location.href = 'perceptions.html';
        });

        // Input focus effect
        document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
            input.addEventListener('focus', () => input.parentElement && input.parentElement.classList.add('shadow-md'));
            input.addEventListener('blur',  () => input.parentElement && input.parentElement.classList.remove('shadow-md'));
        });
    </script>
